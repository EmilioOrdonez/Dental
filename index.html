<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIANDENT - Consultorio y Depósito Dental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; }
        .hero-bg { background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('https://images.unsplash.com/photo-1629909608135-ca2345b1448b?auto=format&fit=crop&q=80&w=1600') center/cover no-repeat; }
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: white; border-radius: 50px; padding: 15px; font-size: 28px; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); }
        .msg-animate { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="fixed w-full z-50 glass-nav border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <span class="text-2xl font-bold text-blue-950 uppercase">Viandent <sup class="text-xs text-sky-500 font-normal">v4.1 Final</sup></span>
        </div>
    </nav>

    <a href="https://wa.me/5215512345678" target="_blank" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

    <section id="inicio" class="hero-bg min-h-screen flex items-center pt-20">
        <div class="max-w-7xl mx-auto px-4 w-full">
            <div class="max-w-3xl">
                <h1 class="text-5xl md:text-7xl font-bold text-white mb-6">Cuidamos tu sonrisa.</h1>
                <a href="#ia-consultorio" class="bg-sky-500 hover:bg-sky-400 text-white px-10 py-5 rounded-2xl text-lg font-bold shadow-2xl inline-block">Consultorio Virtual ✨</a>
            </div>
        </div>
    </section>

    <section id="ia-consultorio" class="py-24 bg-white">
        <div class="max-w-5xl mx-auto px-4">
            <div class="bg-white rounded-[3rem] p-8 md:p-12 shadow-2xl border-t-4 border-sky-500 flex flex-col md:flex-row gap-12 items-center">
                <div class="md:w-1/2">
                    <h2 class="text-4xl font-bold text-slate-900 mb-6">Analiza tus síntomas ✨</h2>
                    <p class="text-slate-600 mb-8">Describe lo que sientes y nuestra IA te orientará.</p>
                </div>
                
                <div class="md:w-1/2 w-full">
                    <div class="bg-slate-50 p-6 rounded-[2rem] shadow-inner border border-slate-200">
                        <div id="ai-chat-window" class="h-64 overflow-y-auto mb-4 space-y-4 p-2">
                            <div class="msg-animate bg-sky-500 text-white p-4 rounded-2xl rounded-tl-none max-w-[85%] text-sm shadow-sm">
                                ¡Hola! Soy el asistente virtual de VIANDENT ✨. ¿En qué te ayudo hoy?
                            </div>
                        </div>

                        <div class="relative">
                            <textarea id="ai-user-input" rows="2" class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 pr-12 focus:ring-2 focus:ring-sky-500 outline-none text-sm resize-none" placeholder="Escribe aquí..."></textarea>
                            <button id="ai-send-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-sky-500 p-2"><i class="fas fa-paper-plane text-xl"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const aiWindow = document.getElementById('ai-chat-window');
        const userInput = document.getElementById('ai-user-input');
        const sendBtn = document.getElementById('ai-send-btn');

        function appendMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = isUser 
                ? "msg-animate bg-slate-200 text-slate-800 p-4 rounded-2xl rounded-tr-none max-w-[85%] text-sm shadow-sm ml-auto"
                : "msg-animate bg-sky-500 text-white p-4 rounded-2xl rounded-tl-none max-w-[85%] text-sm shadow-sm";
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            aiWindow.appendChild(msgDiv);
            aiWindow.scrollTop = aiWindow.scrollHeight;
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = "";
            sendBtn.disabled = true;

            const loadingId = "loading-" + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = "msg-animate text-xs text-slate-400 italic px-2";
            loadingDiv.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> Analizando...';
            aiWindow.appendChild(loadingDiv);
            aiWindow.scrollTop = aiWindow.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Eliminación segura blindada
                const loader = document.getElementById(loadingId);
                if (loader && loader.parentNode) {
                    loader.parentNode.removeChild(loader);
                }

                if (!response.ok) {
                    throw new Error(data.error || "Error de conexión 500");
                }
                
                appendMessage(data.response);
            } catch (error) {
                const loader = document.getElementById(loadingId);
                if (loader && loader.parentNode) {
                    loader.parentNode.removeChild(loader);
                }
                
                let errorMessage = error.message.replace(/\n/g, '<br>');
                appendMessage(`❌ ${errorMessage}`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
